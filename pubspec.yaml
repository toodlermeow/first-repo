name: doc_reader
description: "A clean, minimalist cross-platform Flutter document reader for PDF, Word, Excel, and PowerPoint files."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.6
  open_filex: ^4.7.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  intl: ^0.19.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
